services:
  postgres:
    image: postgres:16-alpine
    container_name: ianseo-steroids-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ianseo
      POSTGRES_PASSWORD: ianseo_password
      POSTGRES_DB: ianseo_steroids
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ianseo -d ianseo_steroids"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata: